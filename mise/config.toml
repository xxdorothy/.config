# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

#
#
# ~xxdorothy/.config.git
# ::: :/mise/config.toml
#
#

monorepo_root = true

include = [
    "{{ config_root }}/.config/mise/tools/worktrunk.tool.toml",
]

# Hooks stay in this file, not an include. mise records an included file as
# loaded, finds it missing from the next directory's configs, and re-parses it
# alone as a config that was left: rooted at .config/mise, its enter hooks
# fire on entering that directory, with config_root rendered there.

[[hooks.enter]]
task = "enter"

# Let tasks move the interactive shell; see shell/cd.zsh.
[[hooks.enter]]
shell  = "zsh"
script = "source {{ config_root }}/.config/mise/shell/cd.zsh"

# Undoes shell/cd.zsh.
[[hooks.leave]]
shell  = "zsh"
script = "(( ! $+functions[_xxdy_shell_cd_unload] )) || _xxdy_shell_cd_unload"

[task_config]
includes = [
    "{{ config_root }}/.config/mise/tasks/*.task.toml",
]

[settings]
experimental = true

# ---------
# Monorepo
# ---------

[monorepo]
config_roots = [
    "dorothy/*",
]

# ------
# Tools
# ------

# ---------------
# Task Templates
# ---------------

[task_templates.worktrunk]
dir   = "{{ cwd }}"
usage = """
flag "-C <path>"    help="Working directory for this command"
flag "-v --verbose" help="Verbose output" count=#true
flag "-y --yes"     help="Skip approval prompts"

complete "path"   type="dir"
complete "branch" run="{{ vars.branches }}"
complete "base"   run="{{ vars.branches }}"
complete "target" run="{{ vars.branches }}"
"""

[task_templates.worktrunk.vars]
branches = "git branch --format='%(refname:short)'"

# wt writes where the shell should go; shell/cd.zsh acts on it at the prompt.
[task_templates.worktrunk.env]
WORKTRUNK_DIRECTIVE_CD_FILE = "{{ env.XXDY_SHELL_CD_FILE | default(value='') }}"
