# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

#
#
# ~xxdorothy/.config.git
# ::: :/mise/config.toml
#
#

monorepo_root = true

include = [
    "{{ config_root }}/.config/mise/hooks.toml",
    "{{ config_root }}/.config/mise/tools/worktrunk.tool.toml",
]

# Undoes shell/cd.zsh, sourced by the enter hook in hooks.toml. It lives here
# because mise does not run leave hooks declared in an included file.
[[hooks.leave]]
shell  = "zsh"
script = "(( ! $+functions[_xxdy_shell_cd_unload] )) || _xxdy_shell_cd_unload"

[task_config]
includes = [
    "{{ config_root }}/.config/mise/tasks/*.task.toml",
]

[settings]
experimental = true

# ---------
# Monorepo
# ---------

[monorepo]
config_roots = [
    "dorothy/*",
]

# ------
# Tools
# ------

# ---------------
# Task Templates
# ---------------

# proj_* describe the worktree a task works in, through proj_git: a git command
# run there that prints nothing, rather than failing, outside a repository.
# Tasks in dorothy/* extend this template, so their own root is the worktree.
[task_templates.project.vars]
proj_git         = "sh -c 'git -C \"$0\" \"$@\" 2>/dev/null || :' '{{ config_root }}'"
proj_wtree_path  = """
{{ exec(command=vars.proj_git ~ ' rev-parse --show-toplevel',
        cache_key='proj_wtree_path',
        cache_duration='1d') }}"""
proj_repo_branch = """
{{ exec(command=vars.proj_git ~ ' branch --show-current',
        cache_key='proj_repo_branch',
        cache_duration='1h') }}"""
proj_repo_origin = """
{{ exec(command=vars.proj_git ~ ' remote get-url origin',
        cache_key='proj_repo_origin',
        cache_duration='1d') }}"""
proj_repo_name   = "{{ vars.proj_repo_origin | file_stem }}"
proj_repo_owner  = "{{ vars.proj_repo_origin | replace(from=':', to='/') | dirname | basename }}"
proj_repo_slug   = "{% if vars.proj_repo_origin %}{{ vars.proj_repo_owner }}/{{ vars.proj_repo_name }}{% endif %}"

[task_templates.worktrunk]
dir   = "{{ cwd }}"
usage = """
flag "-C <path>"    help="Working directory for this command"
flag "-v --verbose" help="Verbose output" count=#true
flag "-y --yes"     help="Skip approval prompts"

complete "path"   type="dir"
complete "branch" run="{{ vars.branches }}"
complete "base"   run="{{ vars.branches }}"
complete "target" run="{{ vars.branches }}"
"""

# As in the project template, but root tasks run where they were invoked.
[task_templates.worktrunk.vars]
branches         = "git branch --format='%(refname:short)'"
proj_git         = "sh -c 'git -C \"$0\" \"$@\" 2>/dev/null || :' '{{ cwd }}'"
proj_wtree_path  = """
{{ exec(command=vars.proj_git ~ ' rev-parse --show-toplevel',
        cache_key='proj_wtree_path',
        cache_duration='1d') }}"""
proj_repo_branch = """
{{ exec(command=vars.proj_git ~ ' branch --show-current',
        cache_key='proj_repo_branch',
        cache_duration='1h') }}"""
proj_repo_origin = """
{{ exec(command=vars.proj_git ~ ' remote get-url origin',
        cache_key='proj_repo_origin',
        cache_duration='1d') }}"""
proj_repo_name   = "{{ vars.proj_repo_origin | file_stem }}"
proj_repo_owner  = "{{ vars.proj_repo_origin | replace(from=':', to='/') | dirname | basename }}"
proj_repo_slug   = "{% if vars.proj_repo_origin %}{{ vars.proj_repo_owner }}/{{ vars.proj_repo_name }}{% endif %}"

# wt writes where the shell should go; shell/cd.zsh acts on it at the prompt.
[task_templates.worktrunk.env]
WORKTRUNK_DIRECTIVE_CD_FILE = "{{ env.XXDY_SHELL_CD_FILE | default(value='') }}"
