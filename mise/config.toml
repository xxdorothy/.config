# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

#
#
# ~xxdorothy/.config.git
# ::: :/mise/config.toml
#
#

monorepo_root = true

[task_config]
includes = [
    "{{ config_root }}/.config/mise/task/*.task.toml",
]

[vars]
proj_repo_path   = """
{{ exec(command='git rev-parse --show-toplevel',
        cache_key='proj_repo_path',
        cache_duration='1d') }}
"""
proj_repo_branch = """
{{ exec(command='git rev-parse --branches',
        cache_key='proj_repo_branch',
        cache_duration='1h') }}
"""
proj_repo_origin = """
{{ exec(command='git remote get-url origin',
        cache_key='proj_repo_origin',
        cache_duration='1d') }}
"""
proj_repo_name   = "{{ vars.proj_repo_origin | file_stem }}"
proj_repo_owner  = "{{ vars.proj_repo_origin | dirname | basename }}"
proj_repo_slug   = "{{ vars.proj_repo_owner }}/{{ vars.proj_repo_name }}"

[settings]
experimental = true

# ---------
# Monorepo
# ---------

[monorepo]
config_roots = [
    "dorothy",
    # "./.github",
    # "./eval",
]

# [monorepo.path_aliases]
# _dy = "{{ [ env.MISE_MONOREPO_ROOT, 'dorothy' ] | join_path }}"
# _gh      = "./.github"
# _eval    = "./eval"
# _dy_main = "./dorothy/main"

# ------
# Tools
# ------

#
# Worktrunk
# https://worktrunk.dev/config
#

[tools."packslip:max-sixty/worktrunk"]
version = "0.81.0"
lazy    = true

[wrappers.wt]
command                     = "wt"
env.WORKTRUNK_WORKTREE_PATH = """
{{ [
    env.MISE_MONOREPO_ROOT | canonicalize,
    env.MISE_PROJECT_ROOT | dirname,
    usage_branch | replace('/\\', '-')
    ] |
join_path }}
"""
# ---------------
# Task Templates
# ---------------

[task_templates.worktrunk]
dir   = "{{ cwd }}"
vars  = { branches = "git branch --format='%(refname:short)'" }
usage = """
flag "-C <path>"    help="Working directory for this command"
flag "-v --verbose" help="Verbose output" count=#true
flag "-y --yes"     help="Skip approval prompts"

complete "path"   type="dir"
complete "branch" run="{{ vars.branches }}"
complete "base"   run="{{ vars.branches }}"
complete "target" run="{{ vars.branches }}"
"""
