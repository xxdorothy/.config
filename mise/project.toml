# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

#
#
# ~xxdorothy/.config.git
# ::: :/mise/project.toml
#
#

# Identification and metadata of a monorepo project, defined once.
#
# A project includes this file from its own mise config, and an included file
# renders in the including file's context: config_root is the worktree, so
# every checkout describes itself, whichever tool created it. Lookups run
# git -C there, which holds wherever exec() runs, including from a git::
# include's cache. [env] mirrors [vars] for root tasks and mise mcp, which see
# only env.
#
# Only the worktree path is cached: its key includes the path, and a
# directory's toplevel cannot change. The branch and origin can (git switch,
# git remote add), and an answer cached while empty would outlive the fix;
# uncached, they cost ~3ms each.
#
# A detached HEAD has no branch; GitHub Actions checks pull requests out that
# way, so there the branch comes from the head ref it names instead.

[vars]
proj_git         = "git -C '{{ config_root }}'"
proj_wtree_path  = """{{ exec(command=vars.proj_git ~ ' rev-parse --show-toplevel',
                             cache_key='proj_wtree_path',
                             cache_duration='1d') }}"""
proj_repo_branch = '''{%- set b = exec(command=vars.proj_git ~ ' branch --show-current') -%}
{%- if b -%}{{ b }}
{%- elif env.GITHUB_HEAD_REF is defined and env.GITHUB_HEAD_REF -%}{{ env.GITHUB_HEAD_REF }}
{%- elif env.GITHUB_REF_TYPE is defined and env.GITHUB_REF_TYPE == 'branch' -%}{{ env.GITHUB_REF_NAME }}
{%- endif -%}'''
proj_repo_origin = "{{ exec(command=vars.proj_git ~ ' remote get-url origin 2>/dev/null || :') }}"
proj_repo_name   = "{{ vars.proj_repo_origin | file_stem }}"
proj_repo_owner  = "{{ vars.proj_repo_origin | replace(from=':', to='/') | dirname | basename }}"
proj_repo_slug   = "{% if vars.proj_repo_origin %}{{ vars.proj_repo_owner }}/{{ vars.proj_repo_name }}{% endif %}"

[env]
XXDY_PROJ_WTREE_PATH  = "{{ vars.proj_wtree_path }}"
XXDY_PROJ_REPO_BRANCH = "{{ vars.proj_repo_branch }}"
XXDY_PROJ_REPO_ORIGIN = "{{ vars.proj_repo_origin }}"
XXDY_PROJ_REPO_NAME   = "{{ vars.proj_repo_name }}"
XXDY_PROJ_REPO_OWNER  = "{{ vars.proj_repo_owner }}"
XXDY_PROJ_REPO_SLUG   = "{{ vars.proj_repo_slug }}"
