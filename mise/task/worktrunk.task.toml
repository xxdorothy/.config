#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

#
#
# ~xxdorothy/.config.git
# ::: :/mise/task/worktrunk.task.toml
#
#

["wt:list"]
description = "Details of existing worktrees"
run         = "wt list"
alias       = "wtl"
extends     = "worktrunk"
raw_args    = true
usage       = """
flag "--branches" help="Include branches without worktrees"
flag "--full"     help="Show CI status and LLM summaries"
"""

["wt:merge"]
description = "Merge source and target branches"
run         = "wt merge"
extends     = "worktrunk"
raw_args    = true
usage       = """
arg  "[target]"             help="Target branch (default: default branch)"
flag "-b --branch <branch>" help="Branch to merge (default: current branch)"
flag "--no-remove"          help="Keep worktree after merge"
"""

["wt:switch-create"]
description = """
Change working directory to worktree of <branch>.
Create the branch and/or worktree if they do not exist.
"""
run         = "wt switch --create"
extends     = "worktrunk"
raw_args    = true
alias       = [ "wtc", "wtsc", "wt-new", "wt-create" ]
usage       = """
arg  "<branch>"               help="Branch to create"
flag "-b --base <base>"       help="Base branch (default: default branch)"
flag "-x --execute <program>" help="Program to run after switch"
"""
