# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

#
#
# ~xxdorothy/.config.git
# ::: :/mise/task/worktrunk.task.toml
#
#

["wt:list"]
description = "Details of existing worktrees"
run         = "wt list"
alias       = "wtl"
extends     = "worktrunk"
raw_args    = true

["wt:merge"]
description = "Merge source and target branches"
run         = "wt merge"
extends     = "worktrunk"
raw_args    = true

["wt:switch-create"]
description = """
Change working directory to worktree of <branch>.
Create the branch and/or worktree if they do not exist.
"""
run         = "wt switch --create"
extends     = "worktrunk"
raw_args    = true
alias       = [ "wtc", "wtsc", "wt-new", "wt-create" ]
usage       = """
var_min=0 var_max=1

arg "[branch]" {
    help="Target branch of merge"
    default="Default branch"
    descriptions=#true
}
flag "-b --branch <branch>" {
    help="Source branch of merge"
    default="Current branch"
    descriptions=#true
}
complete "branch" {
    run="git branch --format='%(refname:short)'"
}

# -----------
# Global CLI
# -----------

# Working Directory
flag "-C <path>" {
    help="Working directory to execute against"
    arg "<path>" {
        default="Current working directory"
        complete type="dir"
    }
    global=#true
    description=#true
}

# User Configuration
flag "--config <path>" {
    help="Filepath of user configuration"
    arg "<path>" {
        default="~/.config/worktrunk/config.toml"
        env="WORKTRUNK_CONFIG_PATH"
        required=#true
        complete type="path:toml"
    }   
    global=#true
    description=#true
}
flag "--config-set <toml>" {
    help="Config override via inline TOML"
    arg "<toml>" {
        required=#true
    }   
    global=#true
    description=#true
}

# Output
flag "-v --verbose" {
    help="Verbose output"
    count=#true 
    global=#true
    description=#true
    env="WORKTRUNK_VERBOSE" {
        choices "0" "1" "2"
    }   
}
flag "-y --yes" {
    help="Pre-emptive confirmation"
    global=#true
    description=#true
}

"""
