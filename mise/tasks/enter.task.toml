[enter]
description = "Hook enter target"
depends     = [ "enter:*" ]
hide        = true

["enter:welcome"]
description = "No Place Like Home"
wait_for    = [ "enter:*" ]
hide        = true
run         = """
#!/usr/bin/env bash
printf '[ %s ]\n' \
    "Dorothy Time~ ^-^"

printf '%-14s: %-2s\n' \
    "Project"   "{{ config_root | basename }}" \
    "Directory" "${MISE_ORIGINAL_CWD:-$PWD}"
"""
