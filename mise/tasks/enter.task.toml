[enter]
description = "Hook enter target"
depends     = [ "enter:*" ]
hide        = true

["enter:welcome"]
description = "No Place Like Home"
wait_for    = [ "enter:*" ]
output      = "interleave"
hide        = true
quiet       = true
run         = """
#!/usr/bin/env zsh
printf '[ %s ]\n' \
    "Dorothy Time~ ^-^"

printf '  %-12s %-2s\n' \
    "Project:"   "{{ config_root | basename }}" \
    "Directory:" "${MISE_ORIGINAL_CWD//${HOME}/~}"
"""
